services:
  jarvis-core:
    image: python:3.12-slim
    container_name: jarvis-core
    working_dir: /app
    command: >
      sh -c "pip install --no-cache-dir uv &&
      uv pip install --system -e packages/shared -e packages/core &&
      uvicorn jarvis_core.api.server:app --host 0.0.0.0 --port 8765"
    ports:
      - "127.0.0.1:8765:8765"
    env_file:
      - ../.env
    volumes:
      - ..:/app
      - ${HOME}/jarvis-data:/root/jarvis-data
    restart: unless-stopped
