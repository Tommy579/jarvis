[project]
name = "jarvis-workspace"
version = "2.0.0"
description = "JARVIS 2.0 : assistant personnel permanent, multi-fournisseurs et interface web 3D"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jarvis-shared",
    "jarvis-core",
    "jarvis-desktop",
]

[dependency-groups]
# Installe par `uv sync` : sans ce groupe, une synchronisation retire pytest et ruff du venv.
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.17.0",
]

[tool.uv.workspace]
members = [
    "packages/shared",
    "packages/core",
    "packages/desktop",
]

[tool.uv.sources]
jarvis-shared = { workspace = true }
jarvis-core = { workspace = true }
jarvis-desktop = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["web/node_modules", "web/dist", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["packages/shared", "packages/core", "packages/desktop", "."]
testpaths = ["tests"]
markers = [
    "integration: test d'integration touchant le vrai systeme (processus, fichiers reels)",
]
