[project]
name = "jarvis-workspace"
version = "2.0.1"
description = "JARVIS 2.0 : assistant personnel permanent, multi-fournisseurs et interface web 3D"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jarvis-shared",
    "jarvis-core",
    "jarvis-desktop",
]

[dependency-groups]
# Installe par `uv sync` : sans ce groupe, une synchronisation retire pytest et ruff du venv.
dev = [
    "mypy>=2.4.1",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
]

[tool.uv.workspace]
members = [
    "packages/shared",
    "packages/core",
    "packages/desktop",
]

[tool.uv.sources]
jarvis-shared = { workspace = true }
jarvis-core = { workspace = true }
jarvis-desktop = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["web/node_modules", "web/dist", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["packages/shared", "packages/core", "packages/desktop", "."]
testpaths = ["tests"]
markers = [
    "integration: test d'integration touchant le vrai systeme (processus, fichiers reels)",
]

[tool.coverage.run]
source = ["jarvis_core", "jarvis_shared", "jarvis_desktop"]

[tool.coverage.report]
# Plancher de non-regression (mesure initiale : 67 %). Remonter au fil des ajouts.
fail_under = 65
skip_covered = true
show_missing = false

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
# Perimetre progressif : on ajoute des fichiers au fur et a mesure, sans bloquer sur l'existant.
files = [
    "packages/shared/jarvis_shared",
    "packages/core/jarvis_core/backup.py",
    "packages/core/jarvis_core/doctor.py",
    "packages/core/jarvis_core/updates.py",
    "packages/core/jarvis_core/scheduler/routines.py",
    "packages/core/jarvis_core/cli.py",
]
