name: OMI 2.0 CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e packages/shared -e packages/core -e packages/desktop pytest pytest-asyncio ruff
      - name: Lint and format check
        run: |
          ruff check packages tests
          ruff format --check packages tests
      - name: Run pytest
        run: pytest tests -q
      - name: Run eval harness
        run: omi eval

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - name: Install backend and frontend dependencies
        run: |
          python -m pip install -e packages/shared -e packages/core -e packages/desktop
          cd web && npm ci && npx playwright install --with-deps chromium
      - name: Build and unit test frontend
        run: |
          cd web
          npm run build
          npx vitest run
      - name: Run Playwright E2E
        run: |
          cd web
          npx playwright test
