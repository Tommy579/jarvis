name: JARVIS 2.0 CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Installation propre : verifie que les dependances DECLAREES suffisent a demarrer le
  # service. Sans ce job, un import non declare passe en developpement (le venv a la
  # dependance par effet de bord) et casse toute installation neuve.
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer le workspace depuis les seules dependances declarees
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/python -m pip install --upgrade pip
          /tmp/clean/bin/python -m pip install ./packages/shared ./packages/core ./packages/desktop
      - name: Verifier que le service et le CLI s'importent
        run: |
          /tmp/clean/bin/python -c "import jarvis_core.api.server, jarvis_core.cli, jarvis_shared, jarvis_desktop; print('imports OK avec les seules dependances declarees')"

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e packages/shared -e packages/core -e packages/desktop pytest pytest-asyncio ruff pytest-cov mypy
      - name: Lint and format check
        run: |
          ruff check packages tests packaging evals
          ruff format --check packages tests packaging evals
      - name: Type check (perimetre progressif)
        run: mypy
      - name: Run pytest
        run: |
          pytest tests -q \
            --cov=jarvis_core --cov=jarvis_shared --cov=jarvis_desktop \
            --cov-report=term --cov-fail-under=65
      - name: Run eval harness
        run: jarvis eval

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - name: Install backend and frontend dependencies
        run: |
          python -m pip install -e packages/shared -e packages/core -e packages/desktop
          cd web && npm ci && npx playwright install --with-deps chromium
      - name: Build and unit test frontend
        run: |
          cd web
          npm run build
          npx vitest run
      - name: Run Playwright E2E
        run: |
          cd web
          npx playwright test

  # Verifie l'image de production : build multi-etapes, demarrage sans .env
  # (mode non securise en loopback) et reponse de /api/health.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Construire l'image
        run: docker build -t jarvis:ci .
      - name: Demarrer le conteneur et verifier /api/health
        run: |
          docker run -d --name jarvis-ci \
            -e JARVIS_ALLOW_INSECURE=1 \
            -e JARVIS_DATA_DIR=/tmp/jarvis-data \
            -p 127.0.0.1:8765:8765 \
            jarvis:ci
          ok=0
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8765/api/health; then ok=1; break; fi
            sleep 2
          done
          if [ "$ok" != "1" ]; then
            docker logs jarvis-ci
            exit 1
          fi
          curl -fsS http://127.0.0.1:8765/api/health
          echo
      - name: Journaux en cas d'echec
        if: failure()
        run: docker logs jarvis-ci || true

  # Analyse statique et audit des dependances : barriere automatique contre les regressions
  # de securite (les tests fonctionnels ne les voient pas).
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - name: Installer les analyseurs et le workspace
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit
          pip install -e packages/shared -e packages/core -e packages/desktop
      - name: SAST Python (bandit, severite moyenne et plus)
        run: bandit -q -ll -r packages -x tests
      - name: Audit des dependances Python
        run: pip-audit
      - name: Audit des dependances frontend
        working-directory: web
        run: npm audit --omit=dev --audit-level=high --package-lock-only
