services:
  jarvis:
    build:
      context: .
      dockerfile: Dockerfile
    image: jarvis:2.0.0
    container_name: jarvis
    restart: unless-stopped
    env_file:
      - .env
    environment:
      JARVIS_DATA_DIR: /data
    ports:
      # Loopback uniquement : l'API n'est jamais exposee au reseau local.
      - "127.0.0.1:8765:8765"
    volumes:
      # Donnees persistantes (SQLite, wiki, exports) hors du conteneur.
      - ${JARVIS_DATA_HOST:-${HOME}/jarvis-data}:/data
    security_opt:
      - no-new-privileges:true
