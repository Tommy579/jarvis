defaults:
  provider: openrouter
  daily_budget_usd: 10.0

autonomous_pool:
  - gemini-4-carbon
  - deepseek/deepseek-v4.1-flash-1017
  - minimax/minimax-m3
  - z-ai/glm-5.3
  - moonshotai/kimi-k3
  - gemini-4-argon
  - gemini-4-hydrogen
  - qwen3.5:2b

roles:
  agent:
    model: deepseek/deepseek-v4.1-flash-1017
    provider: openrouter
    thinking_mode: auto
    fallback:
      - z-ai/glm-5.3
      - minimax/minimax-m3
      - moonshotai/kimi-k3
      - gemini-4-argon
      - gemini-3.5-flash-lite
  orchestrator:
    model: gemini-4-argon
    provider: gemini
    thinking_mode: auto
    fallback:
      - deepseek/deepseek-v4.1-flash-1017
      - z-ai/glm-5.3
      - gemini-4-hydrogen
  triage:
    model: gemini-4-carbon
    provider: gemini
    thinking_mode: auto
    fallback:
      - gemini-4-argon
  vision:
    model: gemini-4-carbon
    provider: gemini
    thinking_mode: auto
    fallback:
      - gemini-4-argon
  memory:
    model: deepseek/deepseek-v4.1-flash-1017
    provider: openrouter
    thinking_mode: auto
    fallback:
      - gemini-3.5-flash-lite
  deep:
    model: gemini-4-hydrogen
    provider: gemini
    thinking_mode: auto
    fallback:
      - gemini-4-argon
      - deepseek/deepseek-v4.1-flash-1017
  voice_realtime:
    model: gemini-live
    provider: gemini
    thinking_mode: auto
