defaults:
  provider: openrouter
  daily_budget_usd: 5.0

roles:
  agent:
    model: deepseek/deepseek-v4.1-flash-1017
    provider: openrouter
    fallback:
      - z-ai/glm-5.3
      - minimax/minimax-m3
      - google/gemini-3.5-flash-lite
  triage:
    model: gemini-3.5-flash-lite
    provider: gemini
    fallback:
      - google/gemini-3.5-flash-lite
  vision:
    model: gemini-3.5-flash-lite
    provider: gemini
    fallback:
      - google/gemini-3.5-flash-lite
  memory:
    model: deepseek/deepseek-v4.1-flash-1017
    provider: openrouter
    fallback:
      - google/gemini-3.5-flash-lite
  deep:
    model: gemini-4-hydrogen
    provider: gemini
    fallback:
      - deepseek/deepseek-v4.1-flash-1017
  voice_realtime:
    model: gemini-live
    provider: gemini

providers:
  openrouter:
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    app_name: OMI
    data_collection: deny
    trusted_for_highly_private: false
  gemini:
    api_key_env: GEMINI_API_KEY
    trusted_for_highly_private: true
  ollama:
    base_url: http://127.0.0.1:11434/v1
    trusted_for_highly_private: true
    models:
      - qwen3.5:2b
      - qwen3.5:0.8b
      - gemma4:31b-cloud
      - nemotron-3-ultra:cloud
      - minimax-m3:cloud
