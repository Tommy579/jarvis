defaults:
  provider: openrouter
  daily_budget_usd: 5.0

autonomous_pool:
  - gemini-4-carbon
  - deepseek/deepseek-v4.1-flash-1017
  - minimax/minimax-m3
  - z-ai/glm-5.3
  - moonshotai/kimi-k3
  - gemini-4-argon
  - gemini-4-hydrogen
  - qwen3.5:2b

roles:
  agent:
    model: deepseek/deepseek-v4.1-flash-1017
    provider: openrouter
    thinking_mode: auto
    fallback:
      - z-ai/glm-5.3
      - minimax/minimax-m3
      - moonshotai/kimi-k3
      - gemini-4-argon
      - gemini-4-carbon
  orchestrator:
    model: gemini-4-argon
    provider: gemini
    thinking_mode: auto
    fallback:
      - deepseek/deepseek-v4.1-flash-1017
      - z-ai/glm-5.3
      - gemini-4-hydrogen
  triage:
    model: gemini-4-carbon
    provider: gemini
    thinking_mode: auto
    fallback:
      - gemini-4-argon
  vision:
    model: gemini-4-carbon
    provider: gemini
    thinking_mode: auto
    fallback:
      - gemini-4-argon
  memory:
    model: deepseek/deepseek-v4.1-flash-1017
    provider: openrouter
    thinking_mode: auto
    fallback:
      - gemini-4-carbon
  deep:
    model: gemini-4-hydrogen
    provider: gemini
    thinking_mode: auto
    fallback:
      - gemini-4-argon
      - deepseek/deepseek-v4.1-flash-1017
  voice_realtime:
    model: gemini-live
    provider: gemini
    thinking_mode: auto

providers:
  openrouter:
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    app_name: JARVIS
    data_collection: deny
    trusted_for_highly_private: false
  gemini:
    api_key_env: GEMINI_API_KEY
    trusted_for_highly_private: true
  ollama:
    base_url: http://127.0.0.1:11434/v1
    trusted_for_highly_private: true
    models:
      - qwen3.5:2b
      - qwen3.5:0.8b
      - gemma4:31b-cloud
      - nemotron-3-ultra:cloud
      - minimax-m3:cloud
