servers:
  # Alternative aux outils browser_* integres (CDP + arbre d'accessibilite, sans screenshot).
  # A n'activer que si tu veux des captures d'ecran : les deux pilotent le meme port CDP et
  # le runtime desactive alors les outils browser_* pour eviter deux implementations
  # concurrentes sur les memes onglets.
  playwright:
    enabled: false
    transport: stdio
    command: "npx"
    args: ["-y", "@playwright/mcp@latest", "--cdp-endpoint", "http://127.0.0.1:9222"]
    default_risk: 2
  notion:
    enabled: false
    transport: stdio
    command: "npx"
    args: ["-y", "@notionhq/notion-mcp-server"]
    default_risk: 2
  github:
    enabled: false
    transport: stdio
    command: "npx"
    args: ["-y", "@modelcontextprotocol/server-github"]
    default_risk: 2
  home_assistant:
    enabled: false
    transport: sse
    url: "http://homeassistant.local:8123/mcp_server/sse"
    default_risk: 2

outbound_server:
  enabled: true
  expose_tools:
    - memory_search
    - wiki_read
    - context_summary
