servers:
  # Alternative aux outils browser_* integres (CDP + arbre d'accessibilite, sans screenshot).
  # A n'activer que si tu veux des captures d'ecran : les deux pilotent le meme port CDP et
  # le runtime desactive alors les outils browser_* pour eviter deux implementations
  # concurrentes sur les memes onglets. Pense a epingler une version exacte avant activation.
  playwright:
    enabled: false
    transport: stdio
    command: "npx"
    args: ["-y", "@playwright/mcp@0.0.28", "--cdp-endpoint", "http://127.0.0.1:9222"]
    default_risk: 2
  notion:
    enabled: false
    transport: stdio
    command: "npx"
    args: ["-y", "@notionhq/notion-mcp-server@1.8.1"]
    default_risk: 2
  github:
    enabled: false
    transport: stdio
    command: "npx"
    args: ["-y", "@modelcontextprotocol/server-github@2025.4.8"]
    default_risk: 2
