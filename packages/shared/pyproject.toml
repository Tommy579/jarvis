[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "omi-shared"
version = "2.0.0"
description = "Contrats Pydantic v2 et generation TypeScript partages pour OMI 2.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["omi_shared*"]
