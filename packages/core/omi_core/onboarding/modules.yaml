modules:
  - id: identite
    title: Identite
    description: Prenom, surnom souhaite, langue, ville et registre d'adresse.
    questions:
      - id: preferred_name
        field_key: preferred_name
        category: identite
        sensitivity: normal
        prompt: Comment veux-tu que Jarvis t'appelle au quotidien ?
        placeholder: Tom
      - id: birth_date
        field_key: birth_date
        category: identite
        sensitivity: normal
        prompt: Quelle est ta date de naissance ?
        placeholder: 1998-05-14
      - id: address_mode
        field_key: address_mode
        category: identite
        sensitivity: normal
        prompt: Preferes-tu le tutoiement ou le vouvoiement ?
        placeholder: tutoiement

  - id: entourage
    title: Entourage
    description: Personnes proches, contacts d'urgence et autorisations de contact.
    questions:
      - id: emergency_contacts
        field_key: emergency_contacts
        category: entourage
        sensitivity: privé
        prompt: Qui peut te joindre en urgence et declencher une alerte prioritaire ?
        placeholder: Maman, Sophie
      - id: close_circle
        field_key: close_circle
        category: entourage
        sensitivity: privé
        prompt: Quels sont tes proches principaux et leur lien avec toi ?
        placeholder: Alex (frere), Claire (collegue)

  - id: travail_etudes
    title: Travail et etudes
    description: Activite principale, projets, pile technique et objectifs du trimestre.
    questions:
      - id: role_job
        field_key: role_job
        category: travail
        sensitivity: normal
        prompt: Quel est ton metier ou ta formation actuelle ?
        placeholder: Developpeur logiciel
      - id: active_projects
        field_key: active_projects
        category: travail
        sensitivity: normal
        prompt: Quels sont tes projets prioritaires ce trimestre ?
        placeholder: OMI 2.0, infra personnelle

  - id: rythme
    title: Rythme
    description: Horaires de sommeil, repas, sport et plages sans derangement.
    questions:
      - id: wake_sleep
        field_key: wake_sleep
        category: rythme
        sensitivity: normal
        prompt: A quelles heures te leves-tu et te couches-tu habituellement ?
        placeholder: 07:30 / 23:30
      - id: focus_windows
        field_key: focus_windows
        category: rythme
        sensitivity: normal
        prompt: Quelles plages horaires doivent rester sans interruption ?
        placeholder: 09:00-12:00 travail profond

  - id: sante
    title: Sante (facultatif)
    description: Allergies, rappels medicaux et objectifs de bien-etre (tres prive).
    questions:
      - id: allergies
        field_key: allergies
        category: sante
        sensitivity: très privé
        prompt: As-tu des allergies ou restrictions alimentaires a retenir ?
        placeholder: Aucune (laisser vide si non concerne)
      - id: health_goals
        field_key: health_goals
        category: sante
        sensitivity: très privé
        prompt: Quels rappels sante ou sommeil souhaites-tu suivre ?
        placeholder: 7h30 de sommeil, sport 3 fois par semaine

  - id: logement_domotique
    title: Logement et domotique
    description: Ville de residence, appareils connectes et serveurs a surveiller.
    questions:
      - id: home_city
        field_key: home_city
        category: logement
        sensitivity: normal
        prompt: Dans quelle ville ou quartier habites-tu pour la meteo et les trajets ?
        placeholder: Lyon
      - id: home_devices
        field_key: home_devices
        category: logement
        sensitivity: privé
        prompt: Quels appareils ou serveurs personnels dois-je surveiller ?
        placeholder: Pi 5 salon, serveur web personnel

  - id: finances
    title: Finances (facultatif)
    description: Echeances recurrentes et seuils d'alerte budgetaire (tres prive).
    questions:
      - id: recurring_bills
        field_key: recurring_bills
        category: finances
        sensitivity: très privé
        prompt: Quelles echeances ou abonnements recurrents dois-je suivre ?
        placeholder: Loyer le 5, hebergeur le 12
      - id: spending_alert
        field_key: spending_alert
        category: finances
        sensitivity: très privé
        prompt: A partir de quel montant un prelevement doit-il declencher une alerte ?
        placeholder: 200 EUR

  - id: gouts
    title: Gouts
    description: Musique, cinema, cuisine, lectures et sujets a eviter.
    questions:
      - id: music_cinema
        field_key: music_cinema
        category: gouts
        sensitivity: normal
        prompt: Quels styles musicaux, films ou cuisines apprecies-tu ?
        placeholder: Jazz, science-fiction, cuisine japonaise
      - id: avoid_topics
        field_key: avoid_topics
        category: gouts
        sensitivity: normal
        prompt: Y a-t-il des sujets d'actualite a filtrer ou eviter ?
        placeholder: Politique quotidienne

  - id: objectifs
    title: Objectifs
    description: Habitudes a ancrer et cap annuel.
    questions:
      - id: yearly_goals
        field_key: yearly_goals
        category: objectifs
        sensitivity: normal
        prompt: Quels sont tes trois objectifs majeurs pour cette annee ?
        placeholder: Finaliser OMI 2.0, courir un semi-marathon

  - id: regles_jarvis
    title: Regles pour Jarvis
    description: Seuils d'appel, ton de reponse et limites strictes.
    questions:
      - id: tone_preference
        field_key: tone_preference
        category: regles
        sensitivity: normal
        prompt: Quel ton souhaites-tu pour Jarvis ?
        placeholder: Pose, concis, legerement pince-sans-rire
      - id: call_triggers
        field_key: call_triggers
        category: regles
        sensitivity: normal
        prompt: Quelles situations justifient un appel telephonique immediat ?
        placeholder: Panne serveur en production, urgence familiale
