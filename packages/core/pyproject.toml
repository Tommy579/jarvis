[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "omi-core"
version = "2.0.0"
description = "Service central omi-core (API, memoire, connecteurs, canaux, onboarding)"
requires-python = ">=3.12"
dependencies = [
    "omi-shared",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "pyyaml>=6.0.2",
    "httpx>=0.28.0",
    "apscheduler>=3.11.0",
    "aiogram>=3.15.0",
    "psutil>=6.0.0",
]

[project.scripts]
omi = "omi_core.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["omi_core*"]
