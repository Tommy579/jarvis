[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-core"
version = "2.0.1"
description = "Service central jarvis-core (API, memoire, connecteurs, canaux, onboarding)"
requires-python = ">=3.12"
dependencies = [
    "jarvis-shared",
    # Service HTTP et contrats
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pydantic>=2.9.0",
    "pyyaml>=6.0.2",
    "httpx>=0.28.0",
    # Planification et canaux
    "apscheduler>=3.11.0",
    "aiogram>=3.15.0",
    # Systeme
    "psutil>=6.0.0",
    "websockets>=13.0",
    "python-dotenv>=1.0.1",
    "keyring>=25.0.0",
    # Fournisseurs LLM, audio et image
    "google-genai>=1.0.0",
    "numpy>=1.26.0",
    "opencv-python>=4.10.0",
    "sounddevice>=0.5.0",
]

[project.optional-dependencies]
# Transcription locale, VAD Silero et empreintes vocales (WeSpeaker ONNX).
voice = [
    "av>=13.0.0",
    "faster-whisper>=1.0.0",
    "onnxruntime>=1.19.0",
    "huggingface-hub>=0.26.0",
]
# Recherche semantique reelle (embeddings denses + sqlite-vec).
memory = [
    "fastembed>=0.4.0",
    "sqlite-vec>=0.1.6",
]

[project.scripts]
jarvis = "jarvis_core.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["jarvis_core*"]
exclude = ["build*", "tests*"]
