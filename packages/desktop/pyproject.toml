[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-desktop"
version = "2.0.1"
description = "Agent de bureau JARVIS 2.0 (plateformes Linux/Windows, icone KDE StatusNotifierItem)"
requires-python = ">=3.12"
dependencies = [
    "jarvis-shared",
    "psutil>=6.0.0",
    # Icone de la zone de notification (StatusNotifierItem)
    "pillow>=10.4.0",
    "pystray>=0.19.5",
    # Capteurs ecran / camera et presse-papiers
    "opencv-python>=4.10.0",
    "pyperclip>=1.9.0",
]

[project.optional-dependencies]
# OCR local des captures d'ecran (Wayland/X11)
ocr = [
    "rapidocr-onnxruntime>=1.3.0",
]
# Integrations Windows (Outlook via ADODB, toasts)
windows = [
    "pyodbc>=5.2.0",
    "win10toast-persist>=0.1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["jarvis_desktop*"]
exclude = ["build*", "tests*"]
